# Model Configuration - Swap models by changing these values
# No code changes required

providers:
  llm:
    provider: "groq"  # Options: vllm, ollama, llamacpp, openai-compatible, groq
    model: "meta-llama/llama-4-scout-17b-16e-instruct"
    max_context_length: 131072
    # Local Ollama config (uncomment to switch back):
    # provider: "ollama"
    # model: "qwen2.5:3b"  # RTX 4050 6GB VRAM
    # vLLM config (uncomment when using vLLM):
    # provider: "vllm"
    # model: "meta-llama/Llama-3.1-8B-Instruct"
    # quantization: "awq-4bit"  # Options: none, gptq-4bit, awq-4bit, int8
    # gpu_memory_utilization: 0.85
    
  embeddings:
    provider: "sentence-transformers"  # Options: sentence-transformers, huggingface
    model: "sentence-transformers/all-MiniLM-L6-v2"  # Lightweight (~80MB) for cloud deployment
    dimensions: 384
    device: "cpu"
    # Larger local model (uncomment to switch back):
    # model: "BAAI/bge-large-en-v1.5"
    # dimensions: 1024
    
  stt:
    provider: "groq-whisper"  # Options: whisper, faster-whisper, groq-whisper
    model: "whisper-large-v3"
    language: "en"
    # Local faster-whisper config (uncomment to switch back):
    # provider: "faster-whisper"
    # model: "large-v3"
    # compute_type: "int8"  # Options: float16, int8, int8_float16
    # device: "cuda"
    # vad_filter: true
    # Lighter local option:
    # model: "medium"
    # compute_type: "int8"
    
  matching:
    # LLM sidecar for hybrid resume-JD matching.
    # When enabled, an LLM qualitative pass runs alongside the
    # embedding-based quantitative scores. Set enabled: false to
    # use pure algorithmic matching only.
    provider: "groq"  # Options: vllm, ollama, openai-compatible, groq
    model: "meta-llama/llama-4-scout-17b-16e-instruct"
    enabled: true  # Master switch — false = pure embedding, true = hybrid
    max_tokens: 1024
    temperature: 0.1
    # Local Ollama config (uncomment to switch back):
    # provider: "ollama"
    # model: "qwen2.5:3b"

  tts:
    provider: "groq-tts"  # Options: coqui-xtts, pyttsx3, groq-tts
    model: "canopylabs/orpheus-v1-english"
    voice: "troy"  # Voices: autumn, diana, hannah (F) | austin, daniel, troy (M)
    # Local Coqui XTTS config (uncomment to switch back):
    # provider: "coqui-xtts"
    # model: "tts_models/multilingual/multi-dataset/xtts_v2"
    # device: "cuda"
    # reference_audio: "assets/interviewer_voice.wav"
    # speaker: "Claribel Dervla"

# Fallback configuration
fallbacks:
  tts:
    - provider: "piper"
      model: "en_US-lessac-medium"
      trigger: "latency > 3000ms"  # Use fallback if primary is slow

# Resource limits
resources:
  max_concurrent_stt: 4
  max_concurrent_tts: 2
  stt_timeout_ms: 10000
  tts_timeout_ms: 8000
